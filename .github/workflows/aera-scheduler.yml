name: Aera Workflow Scheduler

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run-cron:
    runs-on: ubuntu-latest
    environment: Aera_Workflows


    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --ignore-scripts

      # 1. Update Playwright to the latest version to ensure Ubuntu 24.04 support
      - name: Update Playwright
        run: npm install @playwright/test@latest

      # 2. Use the official CLI to install Chromium and its system dependencies
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium


      - name: Run workflow scheduler
        env:
            # Mapping GitHub Secrets to Node.js process.env
            SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
            SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }} # Note: You named it SUPABASE_KEY in secrets
            LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
            LLM_API_URL: ${{ secrets.LLM_API_URL }}
            LLM_MODEL: ${{ secrets.LLM_MODEL }}
            GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }} # Mapping your 'OTHER' key to Groq logic
            GMAIL_USER: ${{ secrets.GMAIL_USER }}
            GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
            FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: node cron-runner.js
